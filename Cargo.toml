[package]
name = "sp-wire"
version = "0.5.0"
edition = "2024"
rust-version = "1.93"
license = "MIT"
description = "The wire types, encodings and constants shared by the Service Points mints and wallet"

[features]
default = []
# Seal and open the PSP payload. Needs AIR, so it is off unless asked for.
seal = ["dep:air"]

[dependencies]
# mint-core is pinned to its release tag; only its types crate is used.
mint-types = { git = "https://github.com/dav-anderson/mint-core.git", tag = "v0.1.3" }
secp256k1 = { version = "0.30", default-features = false, features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4.3"
# AIR has no tags, so it is pinned by commit: 741b1cf, 2.1.0 on master (16 Oct
# 2026). Its manifest has no path dependency, so it builds from git as it is,
# except that 2.1.0 does not export `SecretKey` (see the README): until the
# export is merged upstream and this rev is moved to the merged commit, build
# with the git-ignored patch below pointing at a checkout that has the export.
air = { git = "https://github.com/ramp-stack/air", rev = "741b1cf4ae633aebafcada4d812eb459566d0df7", optional = true }

[dev-dependencies]
secp256k1 = { version = "0.30", default-features = false, features = ["global-context", "serde"] }

# For local work, uncomment to build against the folders next to this one.
# Do not commit it uncommented. See the README.
#
# [patch."https://github.com/dav-anderson/mint-core.git"]
# mint-types = { path = "../mint-core-v0.1.3/crates/mint-types" }
# [patch."https://github.com/ramp-stack/air"]
# air = { path = "../air" }   # a checkout of AIR with `SecretKey` exported; needed until upstream has it
