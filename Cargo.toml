[package]
name = "sp-wire"
version = "0.6.0"
edition = "2024"
rust-version = "1.93"
license = "MIT"
description = "The wire types, encodings and constants shared by the Service Points mints and wallet"

[features]
default = []
# Seal and open the PSP payload. Needs AIR, so it is off unless asked for.
seal = ["dep:air"]
# The mint-info request over AIR: the envelopes, the cell addresses, signing and
# checking a reply. Pure (no network). Implies `seal`, so it needs AIR.
air-request = ["seal"]
# The thin AIR transport (connect, Create, Read, held reads) and an in-process
# test server. Needs `air_server` and `tokio`.
air-client = ["air-request", "dep:air_server", "dep:tokio"]

[dependencies]
# mint-core is pinned to its release tag; only its types crate is used.
mint-types = { git = "https://github.com/dav-anderson/mint-core.git", tag = "v0.3.0" }
secp256k1 = { version = "0.30", default-features = false, features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4.3"
# AIR is pinned by commit. Its only tag is `v2.1.0` (on 741b1cf); 3.0.0 has none, so
# this is eae5133 on its branch `air3-export-secretkey`: the 3.0.0 release commit
# (ff41c09) plus the re-export of `SecretKey`, which `seal` needs (see the README).
air = { git = "https://github.com/ramp-stack/air", rev = "eae5133414fca493fa80ab3facf28248df9ad65d", optional = true }
# air_server is pinned by commit too: efef621, its tag `v1.0.1`, "Release air_server
# 1.0.1 with persisted server identities". It takes `air` 3.0.0 from crates.io, which
# has no `SecretKey` export; the [patch.crates-io] below makes it use the AIR above,
# so one `air` is built.
air_server = { git = "https://github.com/ramp-stack/air_server", rev = "efef62161d2924114be360424ead37220927d099", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"], optional = true }

[dev-dependencies]
secp256k1 = { version = "0.30", default-features = false, features = ["global-context", "serde"] }

# For local work, uncomment to build against the folders next to this one.
# Do not commit it uncommented. See the README.
#
# [patch."https://github.com/dav-anderson/mint-core.git"]
# mint-types = { path = "../mint-core-v0.3.0/crates/mint-types" }

# air_server's `air` (crates.io 3.0.0) is the AIR pinned above, or two `air` crates are
# built and their types do not match. A crate that depends on sp-wire with `air-client`
# needs the same block: a patch applies only in the crate being built.
[patch.crates-io]
air = { git = "https://github.com/ramp-stack/air", rev = "eae5133414fca493fa80ab3facf28248df9ad65d" }
